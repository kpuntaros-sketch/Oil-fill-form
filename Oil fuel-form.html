<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee9db">
  <title>ฟอร์มเติมน้ำมัน</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, "Noto Sans Thai", Tahoma, sans-serif;
      background: #eee9db;
      color: #2c3329;
      line-height: 1.55;
      --paper: #faf7ee;
      --green: #3d503a;
      --muted: #565f50;
      --clay: #a95234;
      --border: #b9b5a6;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(16px, 5vw, 60px);
      background: radial-gradient(ellipse at 17% 4%, #e0dfcd, transparent 55%), #eee9db;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 0.75fr) minmax(0, 1fr);
      width: min(100%, 920px);
      overflow: hidden;
      border: 1px solid #d0c9b9;
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 18px 65px #493b1b13;
    }

    header {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(28px, 5vw, 58px);
      background: #354631;
      color: #fff9e9;
    }

    header::before {
      content: "";
      display: block;
      width: 36px;
      height: 4px;
      background: #e9a780;
      border-radius: 5px;
      margin-bottom: 22px;
    }

    header::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -112px;
      bottom: -145px;
      width: 342px;
      height: 342px;
      border: 1px solid #d8d4ab31;
      border-radius: 50%;
      box-shadow: 0 0 0 22px #d8d4ab16, 0 0 0 46px #d8d4ab10, 0 0 0 72px #d8d4ab0b;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4.2vw, 51px);
      line-height: 1.22;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    form { padding: clamp(22px, 5vw, 48px); }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 16px;
    }

    .wide { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.94rem;
      font-weight: 650;
    }

    input, select, button { font: inherit; }
    input, select {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fffdf7;
      color: inherit;
    }

    input::placeholder, select:invalid { color: var(--muted); }
    select { cursor: pointer; }

    :focus-visible {
      outline: 2px solid var(--clay);
      outline-offset: 3px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      min-height: 48px;
      border: 1px solid var(--green);
      border-radius: 9px;
      padding: 11px 18px;
      font-weight: 650;
      cursor: pointer;
      color: #fff9e9;
      background: var(--green);
    }

    button[type="submit"] { flex: 1 1 10rem; }
    button[type="reset"] { background: transparent; color: var(--green); }
    button[type="submit"]:hover:enabled { background: #2f422e; }
    button[type="reset"]:hover:enabled { background: #e9e9db; }
    button:disabled { cursor: default; opacity: 0.65; }
    .notice { margin: 12px 0 0; font-size: 0.88rem; color: var(--muted); }
    .notice:empty { margin: 0; }
    .notice[data-state="error"] { color: #8b3d24; }

    @media (max-width: 700px) {
      main { grid-template-columns: minmax(0, 1fr); max-width: 540px; }
      header { padding: 27px 24px 30px; }
      header::before { margin-bottom: 14px; }
      header::after { right: -124px; bottom: -252px; }
    }

    @media (max-width: 420px) {
      .fields { grid-template-columns: minmax(0, 1fr); gap: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ฟอร์มเติมน้ำมัน</h1>
    </header>

    <form id="fuel-form" method="post" accept-charset="UTF-8"
      action="https://docs.google.com/forms/d/e/1FAIpQLSem7bmjD5lEtfIRLZBkYmxUmOPPXGEWVfCubtDYiK15t7Eoeg/formResponse">
      <input type="hidden" name="fvv" value="1">
      <input type="hidden" name="pageHistory" value="0">
      <input type="hidden" name="submissionTimestamp" value="-1">

      <div class="fields">
        <div class="wide">
          <label for="plate">ทะเบียนรถ</label>
          <input id="plate" name="entry.1307453519" type="text" placeholder="เช่น กข 1234"
            pattern="[\p{L}\p{M}\p{Nd} ]*[\p{L}\p{Nd}][\p{L}\p{M}\p{Nd} ]*"
            title="ใช้ตัวอักษร ตัวเลข และเว้นวรรคได้" required>
        </div>

        <div class="wide">
          <label for="fuel">ประภทน้ำมัน</label>
          <select id="fuel" name="entry.1521564776" required>
            <option value="" disabled selected>เลือกประเภทน้ำมัน</option>
            <option value="E20">E20</option>
            <option value="Gasohol91">Gasohol91</option>
            <option value="Gasohol95">Gasohol95</option>
            <option value="95">95</option>
            <option value="ดีเซล">ดีเซล</option>
          </select>
        </div>

        <div>
          <label for="price">ราคา (บาท)</label>
          <input id="price" name="entry.503202364" type="text" placeholder="เช่น 750.50"
            pattern="[\p{L}\p{M}\p{Nd}. ]*[\p{L}\p{Nd}][\p{L}\p{M}\p{Nd}. ]*"
            title="ใช้ตัวอักษร ตัวเลข ช่องว่าง และจุดทศนิยมได้" required>
        </div>

        <div>
          <label for="liters">จำนวนลิตรที่เติม (ลิตร)</label>
          <input id="liters" name="entry.2048253079" type="text" inputmode="decimal"
            placeholder="เช่น 20.50" pattern="[0-9]+([.,][0-9]+)?"
            title="กรอกตัวเลขมากกว่า 0 ใช้จุดหรือจุลภาคเป็นทศนิยมได้" required>
        </div>

        <div class="wide">
          <label for="filler">ผู้เติม</label>
          <input id="filler" name="entry.1004115079" type="text" autocomplete="name"
            pattern="[\p{L}\p{M} ]*\p{L}[\p{L}\p{M} ]*"
            title="ใช้ตัวอักษรและเว้นวรรคได้" required>
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="send" disabled>ส่งข้อมูล</button>
        <button type="reset" id="reset" hidden>กรอกรายการใหม่</button>
      </div>
      <p id="status" class="notice" role="status" aria-atomic="true"></p>
      <noscript><p class="notice">เปิด JavaScript เพื่อส่งข้อมูลจากหน้านี้</p></noscript>
    </form>
  </main>

  <script>
    const form = document.querySelector("#fuel-form");
    const sendButton = document.querySelector("#send");
    const resetButton = document.querySelector("#reset");
    const status = document.querySelector("#status");
    const liters = document.querySelector("#liters");
    let sending = false;

    function notify(message, state = "") {
      status.textContent = message;
      status.dataset.state = state;
    }

    liters.addEventListener("input", () => liters.setCustomValidity(""));

    form.addEventListener("input", () => {
      if (sending) return;
      if (resetButton.hidden) {
        notify("");
      } else {
        sendButton.disabled = false;
      }
    });

    form.addEventListener("reset", () => {
      liters.setCustomValidity("");
      notify("");
      resetButton.hidden = true;
      sendButton.disabled = false;
      document.querySelector("#plate").focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (sending || sendButton.disabled) return;

      const normalizedLiters = liters.value.replace(",", ".");
      const volume = Number(normalizedLiters);
      if (!Number.isFinite(volume) || volume <= 0) {
        liters.setCustomValidity("กรอกจำนวนลิตรเป็นตัวเลขมากกว่า 0");
        liters.reportValidity();
        return;
      }

      const body = new URLSearchParams(new FormData(form));
      for (const [name, value] of body) body.set(name, value.trim());
      body.set(liters.name, normalizedLiters);

      sending = true;
      sendButton.disabled = true;
      resetButton.disabled = true;
      notify("กำลังส่งข้อมูล…");
      const fields = [...form.querySelectorAll(".fields input, .fields select")];
      fields.forEach((field) => { field.disabled = true; });

      try {
        await fetch(form.action, {
          method: "POST",
          mode: "no-cors",
          credentials: "omit",
          body
        });
        // Google Forms' cross-origin response is opaque, so the page cannot verify a row was saved.
        notify("ส่งคำขอแล้ว กรุณาตรวจสอบรายการใน Google Sheets");
        resetButton.hidden = false;
      } catch {
        notify("ยืนยันการส่งไม่ได้ กรุณาตรวจสอบ Google Sheets ก่อนลองส่งอีกครั้ง", "error");
        sendButton.disabled = false;
      } finally {
        sending = false;
        resetButton.disabled = false;
        fields.forEach((field) => { field.disabled = false; });
        if (!resetButton.hidden && sendButton.disabled) resetButton.focus();
      }
    });

    sendButton.disabled = false;
  </script>
</body>
</html>
